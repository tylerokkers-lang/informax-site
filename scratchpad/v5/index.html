<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informax Cloud v5</title>
<meta name="description" content="Visual prototype of the next-generation Informax Cloud: Rooms & Areas, Codes, shared content with room overrides, branding, analytics and Super Admin.">
<style>
/* Tokens: taken from informax-site @ bb6184d (src/app/globals.css).
   Only departure: the app canvas is warm #f6f5f2 (brief), not the site's #fbfbfd. */
:root{
  --canvas:#f6f5f2; --panel:#fff; --panel-sunk:#efede8;
  --navy-950:#060a12; --navy-900:#0b1524; --navy-850:#0d1c30; --navy-800:#0f213a; --navy-700:#16304f;
  --ink:#0b1524; --ink-soft:#3d4a5c; --ink-mute:#677285; --ink-faint:#8b94a3;
  --cream:#eaf2fb; --cream-mute:#a4adc0; --dim:#7a849c;
  --blue:#0693e3; --blue-hover:#1aa0ec; --blue-deep:#0470b0; --blue-light:#8ed1fc; --blue-wash:rgba(6,147,227,.08);
  --coral:#ff6b4e; --coral-deep:#e14e33; --coral-wash:rgba(255,107,78,.1);
  --moss:#1f9d6b; --moss-wash:rgba(31,157,107,.1);
  --line:rgba(11,21,36,.1); --line-soft:rgba(11,21,36,.06);
  --line-dark:rgba(255,255,255,.1); --line-dark-soft:rgba(255,255,255,.06);
  --r-sm:12px; --r-md:20px;
  --ease:cubic-bezier(.16,1,.3,1);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --text:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow-card:0 1px 2px rgba(11,21,36,.04),0 8px 24px -16px rgba(11,21,36,.18);
  --shadow-lift:0 2px 4px rgba(11,21,36,.05),0 18px 40px -20px rgba(11,21,36,.28);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink-soft);font-family:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue-light);color:var(--navy-950)}
.tab{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--navy-950);color:var(--cream-mute);display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;
  background-image:radial-gradient(420px 300px at 0% 0%,rgba(6,147,227,.12),transparent 70%)}
.rail-logo{display:flex;align-items:center;padding:4px 10px 18px}
.rail-logo img{height:34px;width:auto}
.hotel-switch{display:flex;align-items:center;gap:10px;margin:0 2px 18px;padding:10px;border-radius:var(--r-sm);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line-dark-soft);text-align:left;width:calc(100% - 4px);transition:background .2s var(--ease)}
.hotel-switch:hover{background:rgba(255,255,255,.08)}
.hotel-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:600 13px/1 var(--display);color:#fff;background:linear-gradient(145deg,#2a3d5c,#16304f);flex:none;letter-spacing:.02em}
.hotel-switch b{display:block;color:#fff;font-weight:600;font-size:14px;line-height:1.2}
.hotel-switch small{display:block;font-size:12px;color:var(--dim)}
.rail-group{font-size:11.5px;font-weight:600;color:var(--dim);padding:14px 12px 6px;letter-spacing:.01em}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--cream-mute);transition:background .2s var(--ease),color .2s var(--ease)}
.nav a svg{opacity:.75;flex:none}
.nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav a[aria-current=page]{color:#fff;background:rgba(6,147,227,.16)}
.nav a[aria-current=page] svg{opacity:1;color:var(--blue-light)}
.nav .count{margin-left:auto;font-size:12px;color:var(--dim)}
.nav .flag{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--coral);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.rail-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line-dark-soft)}
.role{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:12px}
.role button{flex:1;padding:6px 8px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--cream-mute);transition:background .2s var(--ease),color .2s}
.role button[aria-pressed=true]{background:rgba(255,255,255,.1);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:4px 8px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2a3d5c;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.me b{display:block;color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.me small{font-size:12px;color:var(--dim)}

.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:64px;padding:0 40px;background:rgba(246,245,242,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.crumbs{font-size:13.5px;color:var(--ink-mute);display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs a:hover{color:var(--ink)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:38px;padding:0 12px;border-radius:var(--r-sm);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-faint);font-size:14px}
.search kbd{margin-left:auto;font:500 11.5px var(--text);padding:2px 6px;border-radius:6px;background:var(--panel-sunk);color:var(--ink-mute)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-soft);position:relative;transition:background .2s}
.icon-btn:hover{background:rgba(11,21,36,.06)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--canvas)}
.m-only{display:none}

.view{padding:32px 40px 96px;max-width:1280px;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Type ---------- */
.eyebrow{display:block;font-size:13.5px;font-weight:600;color:var(--blue-deep);letter-spacing:-.005em;margin-bottom:8px}
.eyebrow.on-dark{color:var(--blue-light)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.022em;color:var(--ink);margin:0}
.h-page{font-size:34px;line-height:1.1}
.h-sec{font-size:19px;line-height:1.25;letter-spacing:-.015em}
.soft{color:var(--ink-mute)}
.lede{font-size:16px;color:var(--ink-mute);margin:8px 0 0;max-width:60ch}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 14px}
.muted{color:var(--ink-mute)} .faint{color:var(--ink-faint)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-sm);font-size:15px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;user-select:none;transition:transform .16s var(--ease),background-color .16s var(--ease),box-shadow .16s var(--ease),color .16s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{background:rgba(11,21,36,.06);color:var(--ink)}
.btn-secondary:hover{background:rgba(11,21,36,.1)}
.btn-dark{background:rgba(255,255,255,.1);color:#fff}
.btn-dark:hover{background:rgba(255,255,255,.16)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn svg.arrow{transition:transform .2s var(--ease)}
.btn:hover svg.arrow,.link:hover svg.arrow,.row-link:hover svg.arrow,.card-link:hover svg.arrow{transform:translateX(3px)}
.link{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--blue-deep);transition:color .16s}
.link:hover{color:var(--ink)}
.link.on-dark{color:var(--blue-light)} .link.on-dark:hover{color:#fff}

/* ---------- Surfaces ---------- */
.card{background:var(--panel);border-radius:var(--r-sm);box-shadow:var(--shadow-card);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.card-pad{padding:22px 24px}
.card-link:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.hair{border:0;border-top:1px solid var(--line-soft);margin:0}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.stack>*+*{margin-top:16px}
.mt-32{margin-top:32px}.mt-24{margin-top:24px}.mt-16{margin-top:16px}

/* Status: always icon/dot + words */
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
.status.live i{background:var(--moss);box-shadow:0 0 0 3px var(--moss-wash)}
.status.attn{color:var(--coral-deep)} .status.attn i{background:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.status.paused i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-faint)}
.status.draft i{background:var(--blue-light)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;background:var(--panel-sunk);color:var(--ink-soft);white-space:nowrap}
.chip.blue{background:var(--blue-wash);color:var(--blue-deep)}
.chip.coral{background:var(--coral-wash);color:var(--coral-deep)}

/* ---------- Overview hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-md);background:var(--navy-950);color:var(--cream);padding:40px 44px 36px;min-height:300px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:url(assets/earth-horizon.jpg) 70% 30%/cover no-repeat;opacity:.85;transform:scale(1.04);animation:drift 24s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,10,18,.96) 0%,rgba(6,10,18,.82) 42%,rgba(6,10,18,.25) 100%)}
@keyframes drift{from{transform:scale(1.1) translateX(1.5%)}to{transform:scale(1.04)}}
.hero h1{color:#fff;font-size:44px;line-height:1.04;max-width:15ch}
.hero h1 .soft{color:var(--cream-mute)}
.hero p{color:var(--cream-mute);font-size:16.5px;max-width:44ch;margin:14px 0 26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero-health{position:absolute;right:28px;bottom:26px;display:flex;gap:26px;padding:14px 20px;border-radius:var(--r-sm);background:rgba(6,10,18,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-dark)}
.hero-health div{font-size:12.5px;color:var(--cream-mute)}
.hero-health b{display:block;font:600 22px/1.15 var(--display);color:#fff;letter-spacing:-.02em}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:7px;position:relative;top:-1px}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#34d399;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}

.stat .label{font-size:13px;font-weight:500;color:var(--ink-mute)}
.stat .value{font:600 32px/1.1 var(--display);letter-spacing:-.025em;color:var(--ink);margin-top:6px}
.stat .delta{font-size:13px;margin-top:6px;color:var(--ink-mute)}
.stat .delta b{color:var(--moss);font-weight:600}
.stat.attn .value{color:var(--coral-deep)}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
.list li:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel-sunk);color:var(--ink-soft);flex:none}
.ico.coral{background:var(--coral-wash);color:var(--coral-deep)}
.ico.blue{background:var(--blue-wash);color:var(--blue-deep)}
.ico.moss{background:var(--moss-wash);color:var(--moss)}
.list .t{font-weight:600;color:var(--ink);font-size:14.5px;line-height:1.3}
.list .s{font-size:13px;color:var(--ink-mute)}
.list .grow{flex:1;min-width:0}
.row-link{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--blue-deep);white-space:nowrap}

/* ---------- Tables (operational, calm) ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(11,21,36,.05)}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-mute);transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(11,21,36,.08)}
.field{height:38px;padding:0 12px;border-radius:10px;background:var(--panel);border:0;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink);transition:box-shadow .16s}
.field:focus{outline:0;box-shadow:inset 0 0 0 1px var(--blue),0 0 0 3px rgba(6,147,227,.18)}
.table-wrap{background:var(--panel);border-radius:var(--r-sm);box-shadow:var(--shadow-card);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-mute);padding:12px 16px;border-bottom:1px solid var(--line);background:#fcfbf9;white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle;color:var(--ink-soft)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#faf9f6}
tbody tr.clickable:hover .row-arrow{opacity:1;transform:translateX(0)}
.row-arrow{opacity:0;transform:translateX(-4px);transition:all .2s var(--ease);color:var(--blue)}
td .name{font-weight:600;color:var(--ink)}
td .sub{font-size:12.5px;color:var(--ink-mute)}
.num{text-align:right}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13px;color:var(--ink-mute);border-top:1px solid var(--line-soft)}

/* ---------- Room detail ---------- */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:4px 0 24px;overflow-x:auto;scrollbar-width:none}
.tabs button{position:relative;padding:10px 0 12px;font-size:14px;font-weight:500;color:var(--ink-mute);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--blue)}
.block{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line-soft)}
.block:first-child{border-top:0}
.block.override{background:linear-gradient(90deg,rgba(6,147,227,.05),transparent 60%);box-shadow:inset 3px 0 0 var(--blue)}
.src{font-size:12.5px;color:var(--ink-mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;padding:3px;border-radius:10px;background:rgba(11,21,36,.05)}
.toggle button{height:30px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-mute);transition:all .2s var(--ease)}
.toggle button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(11,21,36,.08)}
.toggle button.ov[aria-pressed=true]{color:var(--blue-deep)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px;margin:0}
.kv dt{color:var(--ink-mute)} .kv dd{margin:0;color:var(--ink);font-weight:500;text-align:right}

/* Guest preview (phone) */
.phone{width:264px;margin:0 auto;border-radius:38px;padding:10px;background:#0b0f16;box-shadow:0 30px 60px -30px rgba(11,21,36,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
.screen{border-radius:30px;overflow:hidden;background:var(--g-bg,#faf8f4);height:520px;position:relative;color:var(--g-ink,#1d1a16);font-family:var(--g-font,var(--text))}
.g-hero{height:190px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)),var(--g-img,linear-gradient(135deg,#6b7f8e,#2c3b47));background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:18px;color:#fff}
.g-hero small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.g-hero b{font-family:var(--g-display,var(--display));font-weight:500;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.g-body{padding:14px}
.g-item{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid rgba(0,0,0,.07);font-size:13px}
.g-item span:last-child{color:var(--g-accent,#9b7b4f)}
.g-cta{margin-top:14px;height:40px;border-radius:10px;background:var(--g-accent,#9b7b4f);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.g-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(6,147,227,.92);color:#fff;white-space:nowrap}

/* Branding */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;transition:transform .2s var(--ease)}
.swatch:hover{transform:translateY(-2px)}
.swatch[aria-pressed=true]::after{content:"";position:absolute;inset:-4px;border-radius:15px;box-shadow:0 0 0 2px var(--blue)}
.font-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .2s}
.font-opt[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--blue);background:rgba(6,147,227,.03)}
.font-opt b{font-size:20px;font-weight:500;color:var(--ink)}
.logo-drop{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r-sm);border:1.5px dashed var(--line);background:#fcfbf9}
.logo-drop .lg{width:120px;height:56px;border-radius:10px;background:#1d1a16;color:#f2e6d0;display:grid;place-items:center;font:500 15px/1 Georgia,serif;letter-spacing:.18em}

/* Chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid-line{stroke:var(--line-soft)}
.chart .axis{font-size:11.5px;fill:var(--ink-faint)}
.tip{position:absolute;pointer-events:none;background:var(--navy-900);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.tip b{font-size:15px;font-family:var(--display)}
.tip span{color:var(--cream-mute)}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:12px;font-size:13.5px}
.bar-row .track{height:8px;border-radius:4px;background:var(--panel-sunk);overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:var(--blue);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-row .v{text-align:right;color:var(--ink);font-weight:600}

/* Super Admin: navy banner */
.admin-band{border-radius:var(--r-md);background:var(--navy-900);color:var(--cream-mute);padding:28px 32px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center;
  background-image:radial-gradient(700px 300px at 10% -40%,rgba(6,147,227,.22),transparent 70%)}
.admin-band h1{color:#fff;font-size:30px}
.admin-band .soft{color:var(--cream-mute)}
.admin-stats{display:flex;gap:32px}
.admin-stats b{display:block;color:#fff;font:600 24px/1.1 var(--display)}
.admin-stats span{font-size:12.5px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(6,10,18,.35);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);z-index:61;transform:translateX(100%);transition:transform .45s var(--ease);box-shadow:-30px 0 60px -30px rgba(11,21,36,.35);display:flex;flex-direction:column}
.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer-open .drawer{transform:none}
.drawer header{padding:22px 24px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:flex-start}
.drawer .body{padding:22px 24px;overflow:auto;flex:1}
.drawer footer{padding:16px 24px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
.code-art{width:156px;height:156px;margin:4px auto 18px;border-radius:24px;display:grid;place-items:center;background:var(--navy-950);color:var(--blue-light);position:relative}
.code-art::before,.code-art::after{content:"";position:absolute;inset:26px;border-radius:50%;border:1.5px solid rgba(142,209,252,.35);animation:ring 3s var(--ease) infinite}
.code-art::after{animation-delay:1.5s}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--navy-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;z-index:80;transition:all .35s var(--ease);box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#34d399}

/* Bottom tab bar (mobile) */
.tabbar{display:none}

@media (max-width:1100px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:1fr}
  .hero-health{position:static;margin-top:28px;display:inline-flex}
}
@media (max-width:820px){

function bars(rows){ const max=Math.max(...rows.map(r=>r.v)); return rows.map((r,i)=>`<div class="bar-row" title="${esc(r.l)}: ${r.v.toLocaleString('en-GB')}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)">${r.l}</span><div class="track"><div class="fill" style="width:${r.v/max*100}%;animation-delay:${i*60}ms"></div></div><span class="v tab">${r.v.toLocaleString('en-GB')}</span></div>`).join(''); }

function lineChart(data, labels, unit){
  const W=720,H=220,p={l:40,r:12,t:12,b:26};
  const max=Math.ceil(Math.max(...data)/1000)*1000, min=0;
  const x=i=>p.l+i*(W-p.l-p.r)/(data.length-1), y=v=>p.t+(1-(v-min)/(max-min))*(H-p.t-p.b);
  const pts=data.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const ticks=[0,max/2,max];
  const id='c'+Math.random().toString(36).slice(2,7);
  return `<div class="chart" data-chart='${JSON.stringify({data,labels,unit,W,H,pl:p.l,pr:p.r})}'>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactions per week, rising from ${data[0].toLocaleString('en-GB')} to ${data.at(-1).toLocaleString('en-GB')}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0693e3" stop-opacity=".16"/><stop offset="1" stop-color="#0693e3" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="grid-line" x1="${p.l}" x2="${W-p.r}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${p.l-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?t/1000+'k':t}</text>`).join('')}
    ${labels.map((l,i)=>i%2===0||i===labels.length-1?`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('')}
    <path d="${path} L ${x(data.length-1)} ${y(0)} L ${p.l} ${y(0)} Z" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="#0693e3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .1s forwards"/>
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4.5" fill="#0693e3" stroke="#fff" stroke-width="2"/>
    <line class="xh" x1="0" x2="0" y1="${p.t}" y2="${H-p.b}" stroke="var(--ink-faint)" stroke-dasharray="3 3" opacity="0"/>
    <circle class="xd" r="5" fill="#0693e3" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${p.l}" y="0" width="${W-p.l-p.r}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div></div>`;
}

  <div class="grid g-main mt-24">

    <section class="card card-pad"><h2 class="h-sec" style="margin-bottom:6px">Onboarding</h2><p class="muted" style="margin:0 0 14px;font-size:13.5px">Casa Solaz · Seville</p>
      <ul class="list">${[['Hotel created',1],['Branding uploaded',1],['Rooms & Areas imported',1],['Shared content written',0],['Codes delivered',0],['Go live',0]].map(([t,d])=>`<li style="padding:11px 0"><span class="ico ${d?'moss':''}" style="width:28px;height:28px;border-radius:50%">${d?I(ic.check,15):''}</span><div class="grow"><div class="t" style="${d?'':'color:var(--ink-mute);font-weight:500'}">${t}</div></div></li>`).join('')}</ul>
      <a class="btn btn-secondary btn-sm mt-16" href="#/hotels">Continue setup ${arrow(15)}</a></section>
  </div>`;
};
function hotelTable(compact){
  return `<div class="table-wrap"><table><thead><tr><th>Hotel</th><th class="hide-m">Plan</th><th class="num hide-m">Rooms</th><th class="num hide-m">Codes</th>${compact?'':'<th class="num hide-m">This week</th>'}<th>Status</th></tr></thead><tbody>${HOTELS.map(h=>`
    <tr class="clickable" data-enter="${esc(h.name)}"><td><div style="display:flex;gap:12px;align-items:center"><span class="hotel-mark" style="width:34px;height:34px">${h.mark}</span><div><div class="name">${h.name}</div><div class="sub">${h.place}</div></div></div></td>
    <td class="hide-m">${h.plan}</td><td class="num tab hide-m">${h.rooms||'—'}</td><td class="num tab hide-m">${h.codes||'—'}</td>${compact?'':`<td class="num tab hide-m">${h.week}</td>`}
    <td>${statusEl(h.health).replace('Not yet live','Onboarding')}${h.note?`<div class="sub" style="margin-top:2px">${h.note}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
screens.hotels = () => { crumbs([['Informax','admin'],['Hotels']]); return `
  <div class="page-head"><div><span class="eyebrow">Super Admin</span><h1 class="h-page">Hotels</h1><p class="lede">Open a hotel to work inside its Cloud exactly as its team sees it.</p></div><button class="btn btn-primary" data-toast="Prototype: new hotel">${I(ic.plus,17)} Add hotel</button></div>${hotelTable(false)}`; };
const stub = (t,e) => () => { crumbs([['Informax','admin'],[t]]); return `<div class="page-head"><div><span class="eyebrow">${e}</span><h1 class="h-page">${t}</h1><p class="lede">Not designed in this round.</p></div></div>`; };
screens['admin-codes']=stub('Codes','Platform'); screens['admin-people']=stub('People','Platform'); screens['admin-audit']=stub('Audit log','Platform'); screens['admin-settings']=stub('Settings','Platform');

/* ---------------- Drawer: Code detail ---------------- */
function openCode(id){
  const c = CODES.find(x=>x.id===id); if(!c) return;
  $('#drawer').innerHTML = `
    <header><div><span class="eyebrow">Code</span><h2 class="h-sec tab">${c.id}</h2><div style="margin-top:6px">${statusEl(c.status)}</div></div><button class="icon-btn" data-close aria-label="Close">${I(ic.close,18)}</button></header>
    <div class="body">
      <div class="code-art">${I(ic.codes,44)}</div>
      ${c.note?`<div class="card" style="box-shadow:inset 0 0 0 1px rgba(255,107,78,.25);background:var(--coral-wash);padding:14px 16px;margin-bottom:18px;display:flex;gap:12px"><span style="color:var(--coral-deep)">${I(ic.alert,18)}</span><div><div style="font-weight:600;color:var(--ink)">${c.note}</div><div class="muted" style="font-size:13px">Check it is still in place, or move it to another room.</div></div></div>`:''}
      <dl class="kv"><dt>Room or area</dt><dd>${c.where}</dd><dt>Placed at</dt><dd>${c.spot}</dd><dt>Format</dt><dd>${c.format}</dd><dt>This week</dt><dd class="tab">${c.week||'—'}</dd><dt>Last interaction</dt><dd>${c.last}</dd></dl>
      <hr class="hair" style="margin:22px 0">
      <p class="muted" style="font-size:13.5px;margin:0">A Code never holds content. It opens whatever ${c.where} currently shows, so moving it to another room changes what it opens — nothing to reprint.</p>
    </div>
    <footer><button class="btn btn-secondary" data-toast="Code paused">${c.status==='paused'?'Resume':'Pause'}</button><button class="btn btn-primary" data-toast="Prototype: move Code">Move to another room ${arrow(16)}</button></footer>`;
  document.body.classList.add('drawer-open'); $('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){ document.body.classList.remove('drawer-open'); $('#drawer').setAttribute('aria-hidden','true'); }

let toastT; function toast(msg){ const t=$('#toast'); t.querySelector('span').textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------------- Render & events ---------------- */
function render(keepScroll){
  const {page,arg} = route();
  if(state.role==='hotel' && ['admin','hotels','admin-codes','admin-people','admin-audit','admin-settings'].includes(page)) state.role='super';
  const fn = screens[page] || screens.overview;
  view.innerHTML = fn(arg);
  if(!keepScroll){ view.style.animation='none'; view.offsetHeight; view.style.animation=''; window.scrollTo(0,0); }
  renderNav(); wireCharts();
}
function wireCharts(){
  document.querySelectorAll('.chart').forEach(el=>{
    const cfg=JSON.parse(el.dataset.chart), svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=svg.querySelector('.xh'), xd=svg.querySelector('.xd');
    const max=Math.ceil(Math.max(...cfg.data)/1000)*1000;
    svg.querySelector('.hit').addEventListener('pointermove',e=>{
      const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)/r.width*cfg.W;
      const i=Math.max(0,Math.min(cfg.data.length-1,Math.round((sx-cfg.pl)/((cfg.W-cfg.pl-cfg.pr)/(cfg.data.length-1)))));
      const x=cfg.pl+i*(cfg.W-cfg.pl-cfg.pr)/(cfg.data.length-1), y=12+(1-cfg.data[i]/max)*(cfg.H-38);
      xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('opacity',1);xd.setAttribute('cx',x);xd.setAttribute('cy',y);xd.setAttribute('opacity',1);
      tip.innerHTML=`<b class="tab">${cfg.data[i].toLocaleString('en-GB')}</b> ${cfg.unit}<br><span>Week of ${cfg.labels[i]}</span>`;
      tip.style.left=(x/cfg.W*r.width)+'px'; tip.style.top=(y/cfg.H*r.height)+'px'; tip.style.opacity=1;
    });
    svg.querySelector('.hit').addEventListener('pointerleave',()=>{tip.style.opacity=0;xh.setAttribute('opacity',0);xd.setAttribute('opacity',0);});
  });
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-rf],[data-cf],[data-ov],[data-go],[data-code],[data-toast],[data-close],[data-role],[data-accent],[data-bg],[data-font],[data-enter],#scrim,#m-role');
  if(!t) return;
  if(t.id==='scrim'||t.hasAttribute('data-close')) return closeDrawer();
  if(t.id==='m-role'){ state.role = state.role==='hotel'?'super':'hotel'; return go(state.role==='super'?'admin':'overview'); }
  if(t.dataset.role){ state.role=t.dataset.role; return go(state.role==='super'?'admin':'overview'); }
  if(t.dataset.enter){ state.role='hotel'; toast('Now working inside '+t.dataset.enter); return go('overview'); }
  if(t.dataset.rf){ state.roomFilter=t.dataset.rf; return render(true); }
  if(t.dataset.cf){ state.codeFilter=t.dataset.cf; return render(true); }
  if(t.dataset.accent){ state.brand.accent=t.dataset.accent; return render(true); }
  if(t.dataset.bg){ state.brand.bg=t.dataset.bg; return render(true); }
  if(t.dataset.font){ state.brand.font=t.dataset.font; return render(true); }
  if(t.dataset.ov){ const [r,s,v]=t.dataset.ov.split('|'); state.overrides[r][s]=v==='1'; toast(v==='1'?'Override created for this room only':'Back on shared content'); return render(true); }
  if(t.dataset.code){ return openCode(t.dataset.code); }
  if(t.dataset.go==='hotels-switch'){ state.role='super'; return go('hotels'); }
  if(t.dataset.go){ return go(t.dataset.go); }
  if(t.dataset.toast){ return toast(t.dataset.toast); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
window.addEventListener('scroll', ()=>$('#topbar').classList.toggle('scrolled', scrollY>4), {passive:true});
window.addEventListener('hashchange', ()=>{ closeDrawer(); render(); });
render();
</script>
</body>
</html>
